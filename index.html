<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>spookitys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --body: #000000;
      --accent: #ffffff;
      --accent-rgb: 255, 255, 255;
      --bar-border: rgba(255, 255, 255, 0.28);
      --bar-glow: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--body);
      color: var(--accent);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }

    #matrix {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    .shell {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      pointer-events: none;
    }

    .terminal {
      position: relative;
      width: min(560px, 100%);
      pointer-events: auto;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--bar-border);
      background:
        linear-gradient(
          155deg,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.08) 28%,
          rgba(0, 0, 0, 0.28) 62%,
          rgba(0, 0, 0, 0.42) 100%
        );
      backdrop-filter: blur(28px) saturate(1.35);
      -webkit-backdrop-filter: blur(28px) saturate(1.35);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.38),
        inset 0 -1px 0 rgba(255, 255, 255, 0.06),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        0 18px 50px rgba(0, 0, 0, 0.45),
        0 0 40px var(--bar-glow);
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .terminal::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.2) 0%,
        rgba(255, 255, 255, 0.05) 18%,
        transparent 48%
      );
      opacity: 0.7;
    }

    .terminal:focus-within {
      border-color: color-mix(in srgb, var(--accent) 65%, transparent);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(255, 255, 255, 0.06),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 22px 56px rgba(0, 0, 0, 0.5),
        0 0 52px var(--bar-glow);
    }

    .prompt-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.85rem 1.05rem;
      min-height: 3.1rem;
    }

    .prompt-glyph {
      color: var(--accent);
      opacity: 0.7;
      user-select: none;
      flex-shrink: 0;
      font-weight: 500;
    }

    .field {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 1.35em;
    }

    #commandInput {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--accent);
      font: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      caret-color: transparent;
    }

    #commandInput::placeholder {
      color: color-mix(in srgb, var(--accent) 35%, transparent);
    }

    #commandInput:not(:placeholder-shown)::placeholder {
      opacity: 0;
    }

    .caret {
      position: absolute;
      top: 50%;
      left: 0;
      width: 2px;
      height: 1.1em;
      margin-top: -0.55em;
      border-radius: 1px;
      background: var(--accent);
      pointer-events: none;
      opacity: 0;
      will-change: transform, opacity;
    }

    .caret.visible {
      opacity: 1;
    }

    .measure {
      position: absolute;
      visibility: hidden;
      white-space: pre;
      font: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      pointer-events: none;
    }

    .console {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      border-top: 0 solid transparent;
    }

    .console.open {
      grid-template-rows: 1fr;
      border-top: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .console-inner {
      overflow: hidden;
      min-height: 0;
    }

    #consoleOut {
      max-height: min(42vh, 320px);
      overflow: hidden;
      padding: 0;
      font-size: 0.82rem;
      line-height: 1.55;
      color: color-mix(in srgb, var(--accent) 78%, transparent);
    }

    .console.open #consoleOut {
      padding: 0.85rem 1.05rem 1rem;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
      overflow: hidden;
      max-height: 6em;
      opacity: 1;
      transform: translateY(0);
      transition:
        opacity 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        max-height 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        margin-top 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      animation: lineIn 0.28s ease both;
    }

    .line + .line {
      margin-top: 0.35rem;
    }

    .line.cmd {
      color: var(--accent);
      opacity: 0.55;
    }

    .line.err {
      color: color-mix(in srgb, var(--accent) 70%, #ff6b6b);
    }

    .line.leaving {
      opacity: 0 !important;
      transform: translateY(-6px);
      max-height: 0;
      margin-top: 0 !important;
      pointer-events: none;
      animation: none;
    }

    @keyframes lineIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>

  <div class="shell">
    <div class="terminal" id="terminal">
      <form class="prompt-row" id="commandForm" autocomplete="off">
        <span class="prompt-glyph" aria-hidden="true">&gt;</span>
        <div class="field">
          <input
            id="commandInput"
            type="text"
            spellcheck="false"
            autocapitalize="off"
            autocorrect="off"
            placeholder="type a command…"
            aria-label="Command"
          />
          <span class="measure" id="caretMeasure" aria-hidden="true"></span>
          <div class="caret" id="caret" aria-hidden="true"></div>
        </div>
      </form>
      <div class="console" id="console" aria-live="polite">
        <div class="console-inner">
          <div id="consoleOut"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d", { alpha: true });
    const form = document.getElementById("commandForm");
    const input = document.getElementById("commandInput");
    const caretEl = document.getElementById("caret");
    const caretMeasure = document.getElementById("caretMeasure");
    const consoleEl = document.getElementById("console");
    const consoleOut = document.getElementById("consoleOut");
    const root = document.documentElement;

    const FLIP_MS = 250;
    const CELL = 18;
    const FALLOFF = 90;
    const TRAIL_MS = 500;
    const LINE_TTL_MS = 15000;
    const LINE_EXIT_MS = 360;
    const TRAIL_SAMPLE_GAP = 4;
    const CARET_EASE = 0.22;
    const CARET_BLINK_MS = 1100;

    let cols = 0;
    let rows = 0;
    let cells = [];
    let mouse = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      active: false,
    };
    let trail = [];
    let accentRGB = { r: 255, g: 255, b: 255 };
    let dpr = 1;

    let caretTargetX = 0;
    let caretX = 0;
    let caretBlinkReset = 0;
    let caretFocused = false;

    function parseColor(raw) {
      const value = raw.trim();
      if (!value) return null;

      const probe = document.createElement("span");
      probe.style.color = "";
      probe.style.color = value;
      if (!probe.style.color) return null;

      document.body.appendChild(probe);
      const computed = getComputedStyle(probe).color;
      document.body.removeChild(probe);

      const match = computed.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
      if (!match) return null;

      return {
        css: value,
        r: Number(match[1]),
        g: Number(match[2]),
        b: Number(match[3]),
      };
    }

    function setAccent(color) {
      const parsed = parseColor(color);
      if (!parsed) return false;
      accentRGB = { r: parsed.r, g: parsed.g, b: parsed.b };
      root.style.setProperty("--accent", parsed.css);
      root.style.setProperty("--accent-rgb", `${parsed.r}, ${parsed.g}, ${parsed.b}`);
      root.style.setProperty(
        "--bar-border",
        `rgba(${parsed.r}, ${parsed.g}, ${parsed.b}, 0.28)`
      );
      root.style.setProperty(
        "--bar-glow",
        `rgba(${parsed.r}, ${parsed.g}, ${parsed.b}, 0.12)`
      );
      return true;
    }

    function setBody(color) {
      const parsed = parseColor(color);
      if (!parsed) return false;
      root.style.setProperty("--body", parsed.css);
      document.body.style.background = parsed.css;
      return true;
    }

    function rebuildGrid() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      cols = Math.ceil(w / CELL) + 1;
      rows = Math.ceil(h / CELL) + 1;
      const now = performance.now();
      cells = new Array(cols * rows);
      for (let i = 0; i < cells.length; i++) {
        cells[i] = {
          bit: Math.random() < 0.5 ? 0 : 1,
          nextFlip: now + Math.random() * FLIP_MS,
        };
      }
    }

    function pushTrail(x, y, t) {
      const last = trail[trail.length - 1];
      if (last) {
        const dx = x - last.x;
        const dy = y - last.y;
        if (dx * dx + dy * dy < TRAIL_SAMPLE_GAP * TRAIL_SAMPLE_GAP) return;
      }
      trail.push({ x, y, t });
    }

    function pruneTrail(now) {
      const cutoff = now - TRAIL_MS;
      let i = 0;
      while (i < trail.length && trail[i].t < cutoff) i++;
      if (i > 0) trail = trail.slice(i);
    }

    function distToSegment(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const lenSq = abx * abx + aby * aby;
      if (lenSq < 0.0001) {
        const dx = px - ax;
        const dy = py - ay;
        return { dist: Math.sqrt(dx * dx + dy * dy), t: 0 };
      }
      let t = ((px - ax) * abx + (py - ay) * aby) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const cx = ax + abx * t;
      const cy = ay + aby * t;
      const dx = px - cx;
      const dy = py - cy;
      return { dist: Math.sqrt(dx * dx + dy * dy), t };
    }

    // Cursor blob + 0.5s inverse cone: widest at cursor, tapering off toward the tail
    function influenceAt(cx, cy, now) {
      const dx = cx - mouse.x;
      const dy = cy - mouse.y;
      let best = Math.exp(-Math.sqrt(dx * dx + dy * dy) / FALLOFF);

      const points = trail.length
        ? trail.concat({ x: mouse.x, y: mouse.y, t: now })
        : [{ x: mouse.x, y: mouse.y, t: now }];

      for (let i = 0; i < points.length - 1; i++) {
        const a = points[i];
        const b = points[i + 1];
        const hit = distToSegment(cx, cy, a.x, a.y, b.x, b.y);
        const ageA = (now - a.t) / TRAIL_MS;
        const ageB = (now - b.t) / TRAIL_MS;
        const age = Math.max(0, Math.min(1, ageA + (ageB - ageA) * hit.t));

        // Inverse cone: wide at head (age 0), narrow at tail (age 1)
        const halfWidth = FALLOFF * (1.15 - age * 0.95);
        if (hit.dist > halfWidth * 2.2) continue;

        const radial = Math.exp(-hit.dist / Math.max(halfWidth * 0.5, 1));
        const longitudinal = Math.pow(1 - age, 1.5);
        best = Math.max(best, radial * longitudinal);
      }

      return best;
    }

    function onPointer(e) {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
      pushTrail(mouse.x, mouse.y, performance.now());
    }

    function onPointerLeave() {
      mouse.active = false;
    }

    window.addEventListener("pointermove", onPointer, { passive: true });
    window.addEventListener("pointerdown", onPointer, { passive: true });
    window.addEventListener("pointerleave", onPointerLeave);
    window.addEventListener("blur", onPointerLeave);
    window.addEventListener("resize", () => {
      const wasInactive = !mouse.active;
      rebuildGrid();
      if (wasInactive) {
        mouse.x = window.innerWidth / 2;
        mouse.y = window.innerHeight / 2;
      }
      syncCaretTarget(true);
    });

    function syncCaretTarget(snap = false) {
      const pos = input.selectionStart ?? input.value.length;
      caretMeasure.textContent = input.value.slice(0, pos) || "";
      caretTargetX = caretMeasure.offsetWidth;
      if (snap) caretX = caretTargetX;
      caretBlinkReset = performance.now();
    }

    function updateCaret(now) {
      const focused = caretFocused && document.activeElement === input;
      caretEl.classList.toggle("visible", focused);

      if (!focused) {
        caretEl.style.opacity = "0";
        return;
      }

      caretX += (caretTargetX - caretX) * CARET_EASE;
      if (Math.abs(caretTargetX - caretX) < 0.05) caretX = caretTargetX;
      caretEl.style.transform = `translate3d(${caretX}px, 0, 0)`;

      // Smooth sine blink; resets on typing / caret move so it stays visible while active
      const phase = ((now - caretBlinkReset) % CARET_BLINK_MS) / CARET_BLINK_MS;
      const blink = 0.5 + 0.5 * Math.cos(phase * Math.PI * 2);
      caretEl.style.opacity = String(0.2 + blink * 0.8);
    }

    function draw(now) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);
      ctx.font = `500 ${Math.floor(CELL * 0.72)}px "IBM Plex Mono", monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      pruneTrail(now);
      pushTrail(mouse.x, mouse.y, now);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const i = y * cols + x;
          const cell = cells[i];
          if (now >= cell.nextFlip) {
            cell.bit ^= 1;
            cell.nextFlip += FLIP_MS;
            if (cell.nextFlip < now) cell.nextFlip = now + Math.random() * FLIP_MS;
          }

          const cx = x * CELL + CELL * 0.5;
          const cy = y * CELL + CELL * 0.5;
          const alpha = influenceAt(cx, cy, now);
          if (alpha < 0.02) continue;

          ctx.fillStyle = `rgba(${accentRGB.r}, ${accentRGB.g}, ${accentRGB.b}, ${alpha})`;
          ctx.fillText(String(cell.bit), cx, cy);
        }
      }

      updateCaret(now);
      requestAnimationFrame(draw);
    }

    function openConsole() {
      consoleEl.classList.add("open");
    }

    function closeConsole() {
      consoleEl.classList.remove("open");
    }

    function activeLines() {
      return [...consoleOut.children].filter((el) => !el.classList.contains("leaving"));
    }

    function maybeCloseConsole() {
      if (!activeLines().length && !consoleOut.querySelector(".line.leaving")) {
        closeConsole();
      }
    }

    function removeLine(el) {
      if (!el || el.classList.contains("leaving")) return;
      el.classList.add("leaving");
      const finish = () => {
        if (el.parentNode) el.remove();
        maybeCloseConsole();
        pruneOverflow();
      };
      el.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, LINE_EXIT_MS);
    }

    function pruneOverflow() {
      while (
        consoleOut.scrollHeight > consoleOut.clientHeight + 1
      ) {
        const el = activeLines()[0];
        if (!el) break;
        removeLine(el);
      }
      maybeCloseConsole();
    }

    function pruneExpired() {
      const now = Date.now();
      for (const el of activeLines()) {
        if (now - Number(el.dataset.born) >= LINE_TTL_MS) {
          removeLine(el);
        }
      }
    }

    function appendLine(text, className = "") {
      openConsole();
      const line = document.createElement("div");
      line.className = `line${className ? ` ${className}` : ""}`;
      line.textContent = text;
      line.dataset.born = String(Date.now());
      consoleOut.appendChild(line);
      requestAnimationFrame(() => {
        pruneOverflow();
        requestAnimationFrame(pruneOverflow);
      });
    }

    const HELP = [
      "cmds | help | commands  — list all commands",
      "refresh                 — reload the page",
      "changeaccent <color>    — set accent color",
      "changebody <color>      — set body/background color",
    ];

    function runCommand(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return;

      appendLine(`> ${trimmed}`, "cmd");

      const parts = trimmed.split(/\s+/);
      const cmd = parts[0].toLowerCase().replace(/\/+$/, "");
      const args = parts.slice(1);

      switch (cmd) {
        case "cmds":
        case "help":
        case "commands":
          HELP.forEach((line) => appendLine(line));
          break;

        case "refresh":
          appendLine("refreshing…");
          setTimeout(() => location.reload(), 180);
          break;

        case "changeaccent": {
          if (!args.length) {
            appendLine("usage: changeaccent <color>", "err");
            break;
          }
          const color = args.join(" ");
          if (setAccent(color)) {
            appendLine(`accent → ${color}`);
          } else {
            appendLine(`invalid color: ${color}`, "err");
          }
          break;
        }

        case "changebody": {
          if (!args.length) {
            appendLine("usage: changebody <color>", "err");
            break;
          }
          const color = args.join(" ");
          if (setBody(color)) {
            appendLine(`body → ${color}`);
          } else {
            appendLine(`invalid color: ${color}`, "err");
          }
          break;
        }

        default:
          appendLine(`unknown command: ${cmd}`, "err");
          appendLine("type help for available commands");
          break;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = input.value;
      input.value = "";
      runCommand(value);
      syncCaretTarget(true);
    });

    input.addEventListener("focus", () => {
      caretFocused = true;
      syncCaretTarget(true);
    });
    input.addEventListener("blur", () => {
      caretFocused = false;
    });
    input.addEventListener("input", () => syncCaretTarget());
    input.addEventListener("click", () => syncCaretTarget());
    input.addEventListener("keyup", () => syncCaretTarget());
    input.addEventListener("select", () => syncCaretTarget());
    input.addEventListener("keydown", (e) => {
      // Position updates after the key affects selection
      requestAnimationFrame(() => syncCaretTarget());
      if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
        caretBlinkReset = performance.now();
      }
    });

    setInterval(pruneExpired, 250);

    rebuildGrid();
    syncCaretTarget(true);
    requestAnimationFrame(draw);
    input.focus();

    window.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
      }
    });
  </script>
</body>
</html>
